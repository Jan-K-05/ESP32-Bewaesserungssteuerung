# DFRobot FireBeetle 2 ESP32-E
# Originalkonfiguration; lokale Zugangsdaten werden über secrets.yaml geladen.
esphome:
  name: bewaesserung
  friendly_name: Bewässerung

esp32:
  board: dfrobot_firebeetle2_esp32e
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Bewässerung Fallback"
    password: !secret fallback_password

mqtt:
  broker: !secret mqtt_broker
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  reboot_timeout: 0s

ota:
  - platform: esphome

captive_portal:

switch:
  - platform: gpio
    id: ventil_1
    name: "Ventil 1"
    pin: GPIO18
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: ventil_2
    name: "Ventil 2"
    pin: GPIO13
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: ventil_3
    name: "Ventil 3"
    pin: GPIO14
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: ventil_4
    name: "Ventil 4"
    pin: GPIO26
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: ventil_5
    name: "Ventil 5"
    pin: GPIO25
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: ventil_6
    name: "Ventil 6"
    pin: GPIO4
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: ventil_7
    name: "Ventil 7"
    pin: GPIO17
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: ventil_8
    name: "Ventil 8"
    pin: GPIO16
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    id: regensensor
    name: "Regen erkannt"
    device_class: moisture
    pin:
      number: GPIO36
      mode:
        input: true
      inverted: true
    filters:
      - delayed_on: 1s
      - delayed_off: 10s

sensor:
  - platform: pulse_meter
    id: durchfluss
    name: "Durchfluss"
    pin:
      number: GPIO35
      mode:
        input: true
    unit_of_measurement: "L/min"
    icon: "mdi:water-pump"
    accuracy_decimals: 2
    state_class: measurement
    internal_filter: 100us
    timeout: 10s
    filters:
      - multiply: 0.0015151515
    total:
      id: wassermenge_gesamt
      name: "Wassermenge gesamt"
      unit_of_measurement: "L"
      icon: "mdi:water"
      accuracy_decimals: 2
      state_class: total_increasing
      filters:
        - multiply: 0.0015151515

  - platform: adc
    id: temperatur_adc
    pin: GPIO34
    attenuation: auto
    update_interval: 10s

  - platform: resistance
    id: temperatur_widerstand
    sensor: temperatur_adc
    configuration: DOWNSTREAM
    resistor: 47kOhm

  - platform: ntc
    id: wassertemperatur
    sensor: temperatur_widerstand
    name: "Wassertemperatur"
    calibration:
      b_constant: 3950
      reference_temperature: 25°C
      reference_resistance: 50kOhm
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
